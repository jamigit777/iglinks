<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 50px 20px;
  text-align: center;
}

/* Avatar */
.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 15px;
  border: 2px solid rgba(255,255,255,0.2);
}

/* Name */
h1 {
  font-size: 24px;
  margin: 10px 0 5px;
}

.bio {
  opacity: 0.7;
  font-size: 14px;
  margin-bottom: 25px;
}

/* Button */
.btn {
  display: block;
  margin: 12px 0;
  padding: 14px 16px;
  border-radius: 14px;
  text-decoration: none;
  color: white;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);

  transition: all 0.2s ease;
}

.btn:hover {
  transform: scale(1.04);
  background: rgba(255,255,255,0.12);
}
</style>
